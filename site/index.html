<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotlit</title>
<meta name="description" content="Spotlit, a menu-bar mouse pointer highlighter for the Mac.">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--accent:#F5A000}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#f2f2f4;--mute:#9a9aa1;--line:#2c2c30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:680px;margin:0 auto;padding:48px 20px 64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:36px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--accent);display:inline-block}
.brand a{color:inherit;text-decoration:none}
h1{font-size:28px;line-height:1.25;margin:0 0 6px}
h2{font-size:18px;margin:32px 0 6px}
p,ul{margin:0 0 12px}
ul{padding-left:20px}
li{margin-bottom:6px}
.meta{color:var(--mute);margin-bottom:28px}
a{color:inherit;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:3px}
code{font:14px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--line);padding:1px 5px;border-radius:4px;word-break:break-all}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
footer a{margin-right:14px}
</style>
</head>
<body>
<main>
<div class="brand"><i></i><a href="/">Spotlit</a></div>
<h1>Spotlit</h1>
<p>A menu-bar mouse pointer highlighter for the Mac.</p>
<p><a href="/support">Support</a> &nbsp;&middot;&nbsp; <a href="/privacy">Privacy Policy</a></p>

</main>
</body>
</html>
