name: Spotlit
options:
  bundleIdPrefix: in.kjrlabs
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Spotlit:
    type: application
    platform: macOS
    sources:
      - Sources/Spotlit
      - Sources/AppIcon.icon
      - path: Spotlit.storekit
        buildPhase: none
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Spotlit
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Kshitij Koranne"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sources/Spotlit.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.kjrlabs.spotlit
        DEVELOPMENT_TEAM: AA2WGR36B2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
  SpotlitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Spotlit.storekit
        buildPhase: resources
    dependencies:
      - target: Spotlit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: in.kjrlabs.spotlit.tests
schemes:
  Spotlit:
    build:
      targets:
        Spotlit: all
    test:
      targets:
        - SpotlitTests
    run:
      config: Debug
      storeKitConfiguration: Spotlit.storekit
    archive:
      config: Release
